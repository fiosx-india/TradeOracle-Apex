# Streamlit Cloud -> App -> Settings -> Secrets
# NEVER commit real credentials to GitHub.

ANGELONE_API_KEY = "YOUR_API_KEY"
ANGELONE_CLIENT_ID = "YOUR_CLIENT_ID"
ANGELONE_PIN = "YOUR_PIN"
ANGELONE_TOTP_SECRET = "YOUR_TOTP_SECRET"

# Default read-only market-data instrument.
# NIFTY uses Angel One token 99926000 automatically if this is blank.
ANGELONE_EXCHANGE = "NSE"
ANGELONE_SYMBOL = "NIFTY"
ANGELONE_SYMBOL_TOKEN = ""

ANGELONE_INTERVAL = "ONE_MINUTE"
ANGELONE_HISTORY_BARS = "120"
ANGELONE_LOOKBACK_MINUTES = "240"

# Production read-only mode.
APEX_DATA_MODE = "live"
APEX_HORIZON_MINUTES = "60"
APEX_LIVE_DATA_MAX_AGE_SECONDS = "120"
